[project]
name = "tricycle-agent-workspace"
version = "0.1.0"
description = "Monorepo framework for an autonomous cycloaddition exploration agent."
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.uv.workspace]
members = ["packages/*", "apps/*"]

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = ["tests", "packages", "apps"]
pythonpath = [
    "packages/tricycle-core/src",
    "packages/tricycle-bohr/src",
    "packages/tricycle-bohrsubmit/src",
    "packages/tricycle-reaction-db/src",
    "packages/tricycle-sar/src",
    "packages/tricycle-rits/src",
    "packages/tricycle-sampling/src",
    "packages/tricycle-reactionopt/src",
    "packages/tricycle-exploration/src",
    "apps/tricycle-agent/src",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["runs", "outputs"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
explicit_package_bases = true
warn_redundant_casts = true
warn_unused_ignores = true
