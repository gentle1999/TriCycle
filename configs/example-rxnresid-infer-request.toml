# TriCycle metadata is TOML; the model config and input CSV remain RxnResid-native artifacts.
model_name = "rxnresid-smoke"
machine_type = "c6_m60_1 * NVIDIA 4090"
image = "registry.dp.tech/dptech/dp/native/prod-23278/dl:260828"

input_directory = "/path/to/RxnResid"
code_artifact = { artifact_id = "rxnresid-source", location = "/path/to/RxnResid", kind = "directory" }
checkpoint = { artifact_id = "rxnresid-checkpoint", location = "/path/to/RxnResid/runs/fold-00/checkpoint.pt" }
input_artifacts = [
  { artifact_id = "rxnresid-input", location = "/path/to/RxnResid/data/new_full_df_exact_balanced_40ene_40diene.csv" },
]

# Use the shared command builder. SAR stages and initializes the verified runtime.
command = ["python3.12", "predict.py", "--checkpoint", "runs/fold-00/checkpoint.pt", "--data", "data/new_full_df_exact_balanced_40ene_40diene.csv", "--output", "outputs/rxnresid-predictions.csv"]

output_artifacts = [
  { artifact_id = "rxnresid-predictions", location = "outputs/rxnresid-predictions.csv" },
]

[parameters]
task = "infer"
source_repository = "https://github.com/gentle1999/RxnResid"
source_revision = "a615f4161cb612f5ad98136d4965685009c62bab"
source_manifest = "packages/tricycle-sar/src/tricycle_sar/assets/rxnresid-model.toml"
config_path = "configs/rxnresid.yaml"
data_path = "data/new_full_df_exact_balanced_40ene_40diene.csv"
