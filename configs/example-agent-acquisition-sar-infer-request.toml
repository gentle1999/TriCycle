# Companion RxnResid worker request for one agent-authored acquisition round.
# The bundle directory must contain agent_acquisition_worker.py/.sh,
# agent-acquisition-worker.toml, rxnresid/, inputs/, and outputs/.
model_name = "agent-acquisition-round-0005"
image = "registry.dp.tech/dptech/dp/native/prod-23278/dl:260828"
input_directory = "/path/to/agent-acquisition-worker-bundle"
command = ["bash", "agent_acquisition_worker.sh", "agent-acquisition-worker.toml"]

[code_artifact]
artifact_id = "agent-acquisition-worker-bundle"
location = "/path/to/agent-acquisition-worker-bundle"
kind = "directory"

[checkpoint]
artifact_id = "agent-acquisition-checkpoint"
location = "/path/to/agent-acquisition-worker-bundle/inputs/model/checkpoint.pt"

[[input_artifacts]]
artifact_id = "remaining-candidates"
location = "/path/to/agent-acquisition-worker-bundle/inputs/candidates/remaining-candidates.csv"

[[input_artifacts]]
artifact_id = "validation-data"
location = "/path/to/agent-acquisition-worker-bundle/inputs/evaluation/validation.csv"

[[output_artifacts]]
artifact_id = "agent-acquisition-model-signals"
location = "outputs/agent-acquisition"
kind = "directory"

[parameters]
task = "agent-authored-acquisition-model-signals"
source_repository = "https://github.com/gentle1999/RxnResid"
source_revision = "9deebde39b38df1085dbac3a379c2a59edd7c97d"
upstream_entrypoint = "predict.py"
upstream_protocol = "predict"
model_snapshot_id = "sar-checkpoint-round-0004"
