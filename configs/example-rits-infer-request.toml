# TriCycle request metadata uses TOML; scripts/conf/rits.yaml is native RitS input.
model_name = "rits-smoke"
image = "registry.dp.tech/dptech/dp/native/prod-23278/dl:260828"
# project_id = "replace-with-bohr-project"
machine_type = "c6_m60_1 * NVIDIA 4090"

# Place the RitS source, checkpoint, native YAML, and input data together in the task directory.
# Store the default weights at artifacts/rits/rits.ckpt under the TriCycle root; when assembling the task directory, copy them to
# /path/to/RitS/data/rits.ckpt (the official inference command uses this relative path).
input_directory = "/path/to/RitS"
code_artifact = { artifact_id = "rits-source", location = "/path/to/RitS", kind = "directory" }
checkpoint = { artifact_id = "rits-checkpoint", location = "/path/to/RitS/data/rits.ckpt" }

# run.sh is uploaded inside input_directory and performs editable installation
# from pyproject.toml before running the official inference command.
command = ["bash", "run.sh"]

output_artifacts = [
  { artifact_id = "rits-samples", location = "outputs/rits-smoke.xyz" },
]

[parameters]
task = "infer"
source_repository = "https://github.com/gentle1999/RitS"
source_revision = "07e48da98c4d4f10d0dc1a1cc6b2acad40341c04"
model_manifest = "packages/tricycle-rits/src/tricycle_rits/assets/rits-model.toml"
checkpoint_name = "rits.ckpt"
checkpoint_path = "data/rits.ckpt"
config = "scripts/conf/rits.yaml"
