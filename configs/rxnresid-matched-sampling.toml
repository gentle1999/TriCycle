# RxnResid substrate-pair active-learning experiment.
#
# The three project collections are labels available to the learner. The
# ground-truth collection is used only for the fixed full-space evaluation and
# uncertainty input; it is never added to a project training pool.
experiment_name = "rxnresid-matched-literature-sampling-v1"
strategies = ["predictive-uncertainty", "latin-hypercube", "ucb", "distance-uncertainty-product", "uncertainty-kriging-believer"]
seeds = [0, 1, 2, 3, 4]
# These per-trajectory seeds choose only the first random batch. Later
# acquisition ties use candidate IDs; model training and random-baseline
# ordering share this fixed seed.
fixed_seed = 42
pair_batch_size = 40
round_count = 40
expected_pair_count = 1600
# Acquisition scores are accumulated over all ground-truth paths of a
# substrate pair. This matches the path-level full-space MAE objective.
uncertainty_aggregation = "sum"

# The export stores seconds and also provides this derived hours field. Use
# hours for the cost axis; do not treat seconds as hours.
cost_column = "ts_compute_hours_sum"
cost_unit = "core_hours"
persist_round_predictions = true

[dataset]
ground_truth_collection = "runs/2026-09-17/23-25-49.009869+0800/ground-truth-export/reaction-collection.csv"
ground_truth_resources = "runs/2026-09-17/23-25-49.009869+0800/ground-truth-export/ts-time-aggregation.csv"

[projects.autode]
collection = "runs/2026-09-19/09-34-10.627619+0800/autode-export/reaction-collection.csv"
resources = "runs/2026-09-19/09-34-10.627619+0800/autode-export/ts-time-aggregation.csv"

[projects."dpa-fined-rits-da"]
collection = "runs/2026-09-17/21-11-16.258592+0800/dpa-fined-rits-da-export/reaction-collection.csv"
resources = "runs/2026-09-17/21-11-16.258592+0800/dpa-fined-rits-da-export/ts-time-aggregation.csv"

[projects."rits-zero-shot-da"]
collection = "runs/2026-09-17/20-37-29.580818+0800/rits-zero-shot-da-export-preview/reaction-collection.csv"
resources = "runs/2026-09-17/20-37-29.580818+0800/rits-zero-shot-da-export-preview/ts-time-aggregation.csv"

[rxnresid]
# The verified SAR package supplies this source asset without cloning.
# An optional local checkout must be clean and match the same revision.
source_directory = ""
repository = "https://github.com/gentle1999/RxnResid"
revision = "a615f4161cb612f5ad98136d4965685009c62bab"

[bohr]
project_id = "4657140"
# Requested lightweight GPU model.
machine_type = "c6_m60_1 * NVIDIA 4090"
image = "registry.dp.tech/dptech/dp/native/prod-23278/dl:260828"
# Optional platform limit, in minutes. Leave unset unless the project needs
# a hard limit; the runner still remains one complete trajectory per job.
max_run_time = ""

[training]
# Shared epoch budget for initial fits and checkpoint refits in every round.
epochs = 300
batch_size_paths = 512
device = "auto"
mixed_precision = "no"
