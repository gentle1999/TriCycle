# TriCycle request metadata uses TOML; the native RitS Hydra configuration remains a task artifact.
model_name = "rits-smoke"

# You may omit image, project_id, and machine_type to use environment defaults.
image = "registry.dp.tech/dptech/dp/native/prod-23278/dl:260828"
# project_id = "replace-with-bohr-project"
machine_type = "c6_m60_1 * NVIDIA 4090"

# input_directory is the local task directory uploaded by the Bohr CLI; it must contain the code, data, and configuration below.
input_directory = "/path/to/RitS"
code_artifact = { artifact_id = "rits-source", location = "/path/to/RitS", kind = "directory" }
dataset = { artifact_id = "rits-dataset", location = "/path/to/RitS/data/rits_dataset", kind = "directory" }

# run.sh is uploaded inside input_directory and performs editable installation
# from pyproject.toml before running the command built below.
command = ["bash", "run.sh"]

output_artifacts = [
  { artifact_id = "rits-training-output", location = "outputs", kind = "directory" },
]

[parameters]
task = "train"
source_repository = "https://github.com/gentle1999/RitS"
source_revision = "07e48da98c4d4f10d0dc1a1cc6b2acad40341c04"
model_manifest = "packages/tricycle-rits/src/tricycle_rits/assets/rits-model.toml"
dataset_root = "data/rits_dataset"
