xyz_patterns = ["examples/xyz/*.xyz"]
workers = 4
engine = "dpa"
machine_type = "c6_m60_1 * NVIDIA 4090"
model_path = "model.ckpt.pt"
# DPA requires a GPU machine; engine="gaussian" requires a CPU machine.
# BOHR_IMAGE and BOHR_PROJECT_ID are read from the
# environment when these request fields are omitted.
task_type = "ts"
multi_stage_chk = false
allow_task_failures = true
