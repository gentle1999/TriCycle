# RxnResid fine-tuning is upstream train.py --refit.
# The task directory must be a checkout of the pinned gentle1999/RxnResid commit.
model_name = "rxnresid-finetune-smoke"
machine_type = "c6_m60_1 * NVIDIA 4090"
image = "registry.dp.tech/dptech/dp/native/prod-23278/dl:260828"
input_directory = "/path/to/RxnResid"
code_artifact = { artifact_id = "rxnresid-source", location = "/path/to/RxnResid", kind = "directory" }
checkpoint = { artifact_id = "rxnresid-selection-checkpoint", location = "/path/to/RxnResid/runs/fold-00/checkpoint.pt" }

# Use the shared command builder. SAR stages and initializes the verified runtime.
command = ["python3.12", "train.py", "--refit", "--checkpoint", "runs/fold-00/checkpoint.pt", "--output", "outputs/rxnresid-refit"]

output_artifacts = [
  { artifact_id = "rxnresid-refit-checkpoint", location = "outputs/rxnresid-refit/checkpoint.pt" },
  { artifact_id = "rxnresid-refit-summary", location = "outputs/rxnresid-refit/refit_summary.json" },
]

[parameters]
task = "finetune"
upstream_protocol = "refit"
source_repository = "https://github.com/gentle1999/RxnResid"
source_revision = "a615f4161cb612f5ad98136d4965685009c62bab"
source_manifest = "packages/tricycle-sar/src/tricycle_sar/assets/rxnresid-model.toml"
checkpoint_path = "runs/fold-00/checkpoint.pt"
