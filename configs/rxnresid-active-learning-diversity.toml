# New substrate-pair acquisition strategies for the RxnResid experiment.
# The existing four-strategy run remains separately reproducible; this batch
# contains only the three new strategies requested for comparison.
experiment_name = "rxnresid-cycloaddition-active-learning-diversity"
output_root = "runs/rxnresid-active-learning-diversity"
strategies = [
  "pair-core-set",
  "density-weighted-uncertainty",
  "uncertainty-diversity",
]
seeds = [0, 1, 2, 3, 4]
# These per-trajectory seeds choose only the first random batch. Later
# acquisition ties use candidate IDs; model training and random-baseline
# ordering share this fixed seed.
fixed_seed = 42
pair_batch_size = 40
round_count = 40
expected_pair_count = 1600
uncertainty_aggregation = "sum"
diversity_weight = 0.5
fingerprint_bits = 256

# This is already the materialized core-hour amount in the export. Missing
# values are represented as zero and remain part of the sampling audit.
cost_column = "ts_compute_hours_sum"
cost_unit = "core_hours"
persist_round_predictions = true

[dataset]
ground_truth_collection = "runs/ground-truth-export/reaction-collection.csv"
ground_truth_resources = "runs/ground-truth-export/ts-time-aggregation.csv"

[projects.autode]
collection = "runs/autode-export/reaction-collection.csv"
resources = "runs/autode-export/ts-time-aggregation.csv"

[projects."dpa-fined-rits-da"]
collection = "runs/dpa-fined-rits-da-export/reaction-collection.csv"
resources = "runs/dpa-fined-rits-da-export/ts-time-aggregation.csv"

[projects."rits-zero-shot-da"]
collection = "runs/rits-zero-shot-da-export-preview/reaction-collection.csv"
resources = "runs/rits-zero-shot-da-export-preview/ts-time-aggregation.csv"

[rxnresid]
source_directory = ""
repository = "https://github.com/gentle1999/RxnResid"
# This revision seeds Python, NumPy, and PyTorch and enables deterministic kernels.
revision = "9be807a5b2fa0726aacb7d40f57fe973d6dcadc3"

[bohr]
project_id = "4657140"
machine_type = "1 * NVIDIA T4_16g"
image = "registry.dp.tech/dptech/dp/native/prod-23278/dl:260828"
max_run_time = ""

[training]
# Shared epoch budget for initial fits and checkpoint refits in every round.
epochs = 300
batch_size_paths = 512
device = "auto"
mixed_precision = "no"
