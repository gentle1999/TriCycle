[metadata.agent_acquisition]
schema = "tricycle.agent-acquisition/v1"
function_id = "adaptive-round-0001"
version = "1.0.0"
authored_by = "agent-authored-acquisition"
expression = "(epistemic_variance * (0.5 + sampled_novelty) + context.model_metrics.validation_mae * (1 - pool_local_density) * context.sampled_distribution.coverage_gap) / estimated_cost"
# Transparent linear workload proxy. Replace with a historically calibrated expression when data exists.
cost_expression = "product_count * mean_product_atom_count"
rationale = "Example only: combine model uncertainty with RDKit reaction novelty and candidate-pool sparsity, normalized by the declared linear product-atom workload proxy."
author_notes = "Example only. In a real round, record RDKit version and structure-analysis artifact hashes, summarize validation errors by supported structural groups, cite representative candidate IDs and structures, and explain why the selected structural signals affect this round's ranking."

[metadata.agent_acquisition.context.sampled_distribution]
sampled_count = 12
coverage_gap = 0.35
novelty_definition = "1-minus-max-mean-reactant-product-Morgan-Tanimoto-radius2-2048-chiral-v1"
summary_source = "sha256:replace-with-sampled-set-summary-hash"

[metadata.agent_acquisition.context.model_metrics]
