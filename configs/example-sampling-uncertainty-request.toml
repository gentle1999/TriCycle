# The uncertainty columns are produced by an injected RxnResid model-inference step.
# Native variance fields are preferred by tricycle-sampling; std and 95% interval
# columns may also be copied into the payload for downstream audit.
# The sampling plugin only consumes these values and does not load a model.
strategy = "predictive-uncertainty"
budget = 2
seed = 42

[[candidates]]
candidate_id = "ene-001+diene-001"

[candidates.payload]
reaction_smiles = "A>>B"
predictive_variance = 0.12
epistemic_variance = 0.05
aleatoric_variance = 0.07

