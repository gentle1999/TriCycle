[project]
name = "tricycle-reaction-db"
version = "0.1.0"
description = "Project-scoped reaction calculation-log ingestion, filtering, and dataset export boundary."
requires-python = ">=3.11"
dependencies = ["tricycle-core"]

[project.optional-dependencies]
adaptation = ["rdkit>=2024.3.1"]

[tool.uv.sources]
tricycle-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
