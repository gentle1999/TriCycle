[project]
name = "tricycle-bohrsubmit"
version = "0.1.0"
description = "Typed Bohr batch and Gaussian/DPA-Berny workflow orchestration for TriCycle Agent."
requires-python = ">=3.11"
dependencies = ["tricycle-core", "tricycle-bohr"]

[tool.uv.sources]
tricycle-core = { workspace = true }
tricycle-bohr = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
